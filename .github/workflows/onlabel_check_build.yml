# Workflow triggered when labeling a pull request with `build::check`
# This action is adapted from https://github.com/t4d-gmbh/stubbed_versioning
name: Check Container Builds

on:
  pull_request:
    types: [ labeled ]

env:
  LABEL_CHECK: 'build::check'
  LABEL_SUCCESS: 'build::passed'
  LABEL_FAILURE: 'build::failed'

  REPO_PATH: ${{ vars.REPO_PATH }}
  # REPO_PATH: github.com:furrer-lab/abn.git  # for private repo cloned via ssh
  # Set the path to the package where the DESCRIPTION file can be found
  PACKAGE_PATH: ${{ vars.PACKAGE_PATH || './' }}
  JAGS: ${{ vars.JAGS }}
  # this if for the valgrind container only
  DRMEMORY: ${{ vars.DRMEMORY }}
  # Namespaces local images within this workflow run.
  CUSTOM_TAG: "onlabel-check-build-${{ github.run_number }}"

jobs:

  # Each matrix runner builds the complete stack locally. No image is pushed
  # and no intermediate image is shared through the registry.
  build:
    runs-on: ubuntu-latest
    env:
      BUILDKIT_PROGRESS: plain
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: debian-clang-devel
            dockerfile: debian
            final_dockerfile: Dockerfile
            compiler: clang
            rhub_image: ubuntu-clang
            r_version: devel
          - label: debian-gcc-release
            dockerfile: debian
            final_dockerfile: Dockerfile
            compiler: gcc
            rhub_image: ubuntu-release
            r_version: release
          - label: fedora-gcc-devel
            dockerfile: fedora
            final_dockerfile: Dockerfile.abn
            compiler: gcc
            rhub_image: gcc15
            r_version: devel
          - label: fedora-valgrind-gcc-devel
            dockerfile: valgrind
            final_dockerfile: Dockerfile.abn
            compiler: gcc
            rhub_image: valgrind
            r_version: devel
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Build syslibs
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.syslibs
          load: true
          tags: local/${{ matrix.label }}/syslibs:${{ env.CUSTOM_TAG }}
          build-args: |
            R_VERSION=${{ matrix.r_version }}
            RHUB_IMAGE=${{ matrix.rhub_image }}
            DRMEMORY=${{ env.DRMEMORY }}

      - name: Build JAGS
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.jags
          load: true
          tags: local/${{ matrix.label }}/jags:${{ env.CUSTOM_TAG }}
          build-args: |
            BASE_IMAGE=local/${{ matrix.label }}/syslibs:${{ env.CUSTOM_TAG }}
            COMPILER=${{ matrix.compiler }}
            JAGS=${{ env.JAGS }}

      - name: Build INLA
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.inla
          load: true
          tags: local/${{ matrix.label }}/inla:${{ env.CUSTOM_TAG }}
          build-args: BASE_IMAGE=local/${{ matrix.label }}/syslibs:${{ env.CUSTOM_TAG }}

      - name: Build Bioconductor
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.bioc
          load: true
          tags: local/${{ matrix.label }}/bioc:${{ env.CUSTOM_TAG }}
          build-args: BASE_IMAGE=local/${{ matrix.label }}/syslibs:${{ env.CUSTOM_TAG }}

      - name: Build JAGS and INLA
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.jags-inla
          load: true
          tags: local/${{ matrix.label }}/jags-inla:${{ env.CUSTOM_TAG }}
          build-args: BASE_IMAGE=local/${{ matrix.label }}/jags:${{ env.CUSTOM_TAG }}

      - name: Build JAGS, INLA, and Bioconductor
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/Dockerfile.jags-inla-bioc
          load: true
          tags: local/${{ matrix.label }}/jags-inla-bioc:${{ env.CUSTOM_TAG }}
          build-args: BASE_IMAGE=local/${{ matrix.label }}/jags-inla:${{ env.CUSTOM_TAG }}

      - name: Build ABN
        uses: docker/build-push-action@f2a1d5e99d037542a71f64918e516c093c6f3fc4
        with:
          context: ./containers/
          file: ./containers/${{ matrix.dockerfile }}/${{ matrix.final_dockerfile }}
          load: true
          tags: local/${{ matrix.label }}/abn:${{ env.CUSTOM_TAG }}
          build-args: |
            BASE_IMAGE=local/${{ matrix.label }}/jags-inla-bioc:${{ env.CUSTOM_TAG }}
            COMPILER=${{ matrix.compiler }}
            PACKAGE_PATH=${{ env.PACKAGE_PATH }}
            REPO_PATH=${{ env.REPO_PATH }}

      - name: Verify final image and write configuration
        run: |
          mkdir -p info
          docker run --rm --user 1001 \
            --volume "$GITHUB_WORKSPACE:/workspace" \
            --workdir /workspace \
            local/${{ matrix.label }}/abn:${{ env.CUSTOM_TAG }} \
            Rscript -e 'cat("R.home(): ", R.home(), "\\n"); stopifnot(requireNamespace("INLA", quietly=TRUE), requireNamespace("rjags", quietly=TRUE), requireNamespace("Rgraphviz", quietly=TRUE)); knitr::knit_hooks$set(output = function(x, options) gsub("##", ">\\n> ", x)); knitr::knit("src/release_info.tpl", sprintf("info/%s-abn.md", "${{ matrix.label }}"))'
      - uses: actions/upload-artifact@v4
        with:
          name: info-artifact-${{ matrix.label }}
          path: info/${{ matrix.label }}-abn.md
  report_build_check:
    if: ${{ !cancelled() }}
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      repository-projects: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      OWNER: ${{ github.repository_owner }}
      REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Check if on demand tasks succeeded
        run: |
          gh pr edit ${{ env.EVENT }} --remove-label ${{ env.LABEL_CHECK }} --repo ${{ env.OWNER }}/${{ env.REPO }}
          build_result="${{ needs.build.result }}"
          gh pr edit ${{ env.EVENT }} --remove-label ${{ env.LABEL_SUCCESS }} --repo ${{ env.OWNER }}/${{ env.REPO }}
          if [ "$build_result" == "success" ]; then
            gh pr edit ${{ env.EVENT }} --remove-label ${{ env.LABEL_FAILURE }} --repo ${{ env.OWNER }}/${{ env.REPO }}
            gh pr edit ${{ env.EVENT }} --add-label ${{ env.LABEL_SUCCESS }} --repo ${{ env.OWNER }}/${{ env.REPO }}
            echo "### ${{ github.event.label.url }} passed! :rocket:" >> $GITHUB_STEP_SUMMARY
            exit 0
          else
            gh pr edit ${{ env.EVENT }} --add-label ${{ env.LABEL_FAILURE }} --repo ${{ env.OWNER }}/${{ env.REPO }}
            echo "### ${{ github.event.label.url }} failed!" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi
        shell: bash
        env:
          EVENT: ${{ github.event.number }}  # This is either the issue or pr

  build_check_passed:
    if: ${{ always() }}
    needs:
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Assert that all builds passed
        run: |
          build_result="${{ needs.build.result }}"
          if [[ "$build_result" == 'success' ]]; then
            echo 'The images were built successfully!';
          else exit 1; fi
